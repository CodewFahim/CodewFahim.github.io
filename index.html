const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function formatMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  return `${MONTHS[m - 1]} ${y}`;
}

// Inclusive month count, the way LinkedIn reports tenure.
function formatDuration(start, end) {
  const [sy, sm] = start.split("-").map(Number);
  const now = new Date();
  const [ey, em] = end ? end.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1];
  const total = (ey - sy) * 12 + (em - sm) + 1;
  const years = Math.floor(total / 12);
  const months = total % 12;
  return [years && `${years} yr${years > 1 ? "s" : ""}`, months && `${months} mo${months > 1 ? "s" : ""}`].filter(Boolean).join(" ");
}

// Whole years worked, from the EXPERIENCE dates, counting overlapping roles once.
function yearsOfExperience() {
  const index = ym => {
    const [y, m] = ym.split("-").map(Number);
    return y * 12 + (m - 1);
  };
  const now = new Date();
  const today = now.getFullYear() * 12 + now.getMonth();
  const spans = EXPERIENCE.map(job => [index(job.start), job.end ? index(job.end) : today]).sort((a, b) => a[0] - b[0]);
  let months = 0;
  let [start, end] = spans[0];
  for (const [s, e] of spans.slice(1)) {
    if (s > end + 1) {
      months += end - start + 1;
      [start, end] = [s, e];
    } else {
      end = Math.max(end, e);
    }
  }
  months += end - start + 1;
  return Math.floor(months / 12);
}
function prefersReducedMotion() {
  return typeof window !== "undefined" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function scrollToId(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({
    behavior: prefersReducedMotion() ? "auto" : "smooth",
    block: "start"
  });
}
const navTo = (id, after) => event => {

};
function useScrollState() {
  const [state, setState] = useState({
    scrolled: false,
    progress: 0,
    showTop: false
  });
  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setState({
        scrolled: y > 8,
        progress: max > 0 ? Math.min(1, y / max) : 0,
        showTop: y > 700
      });
    };
    onScroll();
    window.addEventListener("scroll", onScroll, {
      passive: true
    });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return state;
}
